version: '3'

services:
    database:
        build:
            context: ./docker/postgres
        ports:
          - "${DB_DOCKER_HOST_PORT}:5432"
        environment:
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        volumes:
            - postgresql:/var/lib/postgresql/data/

    php:
        build:
            context: ./docker/php
        depends_on:
          - database
        working_dir: /app
        volumes:
            - ./:/app/
            - ~/.composer/docker-cache/:/root/.composer:cached

    rabbitmq:
      build:
        context: ./docker/rabbitmq
      ports:
        - "${DOCKER_RABBIT_MQ_PORT}:5672"
      hostname: rabbitmq
      restart: always
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBIT_MQ_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBIT_MQ_PASSWORD}
        - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
      command: >
        bash -c "
          rabbitmq-plugins enable rabbitmq_management rabbitmq_prometheus &&
          rabbitmq-server
        "

    webserver:
      build:
        context: ./docker/nginx/
      depends_on:
        - php
      ports:
        - "${APP_DOCKER_HOST_PORT}:80"
      tty: true
      volumes:
        - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
        - ./public/:/app/public/:ro

    prometheus:
      image: prom/prometheus:latest
      ports:
        - "${DOCKER_PROMETHEUS_HOST_PORT}:9090"
      volumes:
        - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus-data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=7d'
      restart: unless-stopped

    node-exporter:
      privileged: true
      image: prom/node-exporter
      restart: always
      ports:
        - "${DOCKER_NODE_EXPORTER_HOST_PORT}:9100"
      volumes:
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/rootfs:ro
      command:
        - "--path.procfs=/host/proc"
        - "--path.sysfs=/host/sys"
        - "--collector.filesystem.ignored-mount-points"
        - "^/(rootfs/)?(dev|etc|host|proc|run|sys|volume1)($$|/)"
    cadvisor:
      image: gcr.io/cadvisor/cadvisor:latest
      privileged: true
      devices:
        - /dev/kmsg
      ports:
        - "${DOCKER_CADVISOR_HOST_PORT}:8080"
      volumes:
        - /:/rootfs:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
      restart: unless-stopped

    postgres-exporter:
      image: quay.io/prometheuscommunity/postgres-exporter
      ports:
        - "${DOCKER_POSTGRES_EXPORTER_HOST_PORT}:9187"
      environment:
        - POSTGRES_USER=${DB_USERNAME}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_DATABASE}
      restart: unless-stopped

    grafana:
      image: grafana/grafana-enterprise
      environment:
        - GF_SERVER_ROOT_URL=http://grafana:3000/
        - GF_PLUGINS_PREINSTALL=grafana-metricsdrilldown-panel,grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app
      ports:
        - "${DOCKER_GRAFANA_HOST_PORT}:3000"
      volumes:
        - grafana_storage:/var/lib/grafana
      restart: unless-stopped

volumes:
  postgresql:
    driver: local
  prometheus-data:
    driver: local
  grafana_storage:
    driver: local

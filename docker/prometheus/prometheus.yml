scrape_configs:
  - job_name: bves
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: node
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: rabbitmq
    scrape_interval: 30s
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: postgres-exporter
    scrape_interval: 1s
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: 'symfony'
    static_configs:
      - targets: ['php:8000']
    metrics_path: '/metrics'
    scrape_interval: 1s